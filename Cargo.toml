[workspace]
resolver = "2"
members = [".", "rig-cli"]

[workspace.package]
authors = ["Chris Cheng <chris.cheng.c4@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/faberline/rig"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
clap = { version = "4", features = ["derive", "string"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package]
name = "rig"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Declarative test-scenario harness engine — e2e scenarios + open-loop load pins, one agent-readable JSON report"

[lib]
name = "rig"
crate-type = ["rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml = "0.8"
# Sync HTTP client: scenario steps and the open-loop load generator run on
# plain worker threads, no async runtime needed.
ureq = { version = "2", features = ["json"] }
# Sync Postgres client (feature-gated) for the postgres load transport — same
# blocking thread model as the HTTP path. Off by default to keep rig lean.
postgres = { version = "0.19", optional = true }

[features]
# Enables the postgres load transport (pulls a tokio runtime via the `postgres`
# crate). Consumers comparing a SQL backend (e.g. arena) opt in.
postgres = ["dep:postgres"]

[dev-dependencies]
tempfile = "3"

[[test]]
name = "http_auth_rotation"
path = "e2e/http_auth_rotation.rs"

[[test]]
name = "load_http_request_identity"
path = "e2e/load_http_request_identity.rs"

[[test]]
name = "manifest_declared_test_paths"
path = "e2e/manifest_declared_test_paths.rs"
